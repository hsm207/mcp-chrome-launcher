name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm OIDC Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc for
      # `registry-url`, and an auth token of any kind makes npm skip the OIDC exchange.
      # Strip the token line here and unset the variables at publish time.
      - name: Remove placeholder auth token from .npmrc
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          npm --version

      - run: npm ci

      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      # Chrome-backed tests must pass (100% coverage) before anything is published.
      - name: Run tests
        run: |
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/bin/google-chrome
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a npm run test:coverage

      # `prepublishOnly` re-runs `npm run test:coverage`, so the publish itself also
      # needs a virtual display. No NODE_AUTH_TOKEN: npm falls back to OIDC.
      - name: Publish to npm with provenance
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN YARN_NPM_AUTH_TOKEN
          xvfb-run -a npm publish --provenance --access public
