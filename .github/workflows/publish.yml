name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing + provenance, and MCP Registry `login github-oidc`

env:
  # Pinned deliberately: the binary is verified against this tag's Sigstore bundle.
  MCP_PUBLISHER_VERSION: v1.8.9

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc for
      # `registry-url`, and an auth token of any kind makes npm skip the OIDC exchange.
      # Strip the token line here and unset the variables at publish time.
      - name: Remove placeholder auth token from .npmrc
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          npm --version

      - run: npm ci

      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      # Chrome-backed tests must pass (100% coverage) before anything is published.
      - name: Run tests
        run: |
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/bin/google-chrome
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a npm run test:coverage

      # `prepublishOnly` re-runs `npm run test:coverage`, so the publish itself also
      # needs a virtual display. No NODE_AUTH_TOKEN: npm falls back to OIDC.
      - name: Publish to npm with provenance
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN YARN_NPM_AUTH_TOKEN
          xvfb-run -a npm publish --provenance --access public

      # The registry validates the npm package (and its `mcpName`) before accepting the
      # server, so wait until the just-published version is actually being served.
      - name: Wait for npm to serve the published version
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 24); do
            if npm view "mcp-chrome-launcher@${version}" version >/dev/null 2>&1; then
              echo "npm is serving mcp-chrome-launcher@${version}"
              exit 0
            fi
            echo "attempt ${attempt}: not served yet, retrying in 5s"
            sleep 5
          done
          echo "npm never served mcp-chrome-launcher@${version}" >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # Belt and braces: fail before the OIDC exchange if server.json is malformed.
      - name: Validate server.json
        run: ./mcp-publisher validate

      # `npm version` keeps these in lockstep on branches, but a tag must win over a stale file.
      - name: Sync server.json version to the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
