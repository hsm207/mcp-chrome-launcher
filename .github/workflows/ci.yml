name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - if: runner.os == 'Linux'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - if: runner.os == 'Linux'
        run: |
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/bin/google-chrome
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a npm run test:coverage
      - if: runner.os != 'Linux'
        run: npm run test:coverage

  test-lts-floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - run: |
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/bin/google-chrome
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a npm run test:coverage
